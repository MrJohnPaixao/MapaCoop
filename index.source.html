<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="MapaCoop Lu System: mapa interativo da area de atuacao cooperativa">
  <meta name="theme-color" content="#0A0F1E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MapaCoop">

  <title>MapaCoop Lu System</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="lib/maplibre-gl.css">
  <script src="lib/maplibre-gl.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header id="header">
  <button id="btn-menu" aria-label="Abrir menu">☰</button>
  <div class="brand-lockup" aria-label="Lu System">
    <img class="logo-mark" src="icons/lu-moon.svg" alt="">
    <div class="wordmark"><span class="lu">LU</span> <span class="system">SYSTEM</span></div>
  </div>
  <div class="header-text">
    <h1>MapaCoop <span class="brand-sub">Sicredi</span></h1>
    <p>Inteligencia territorial cooperativa</p>
  </div>
  <div class="header-badges">
    <div class="badge">
      <strong id="badge-atu">—</strong>
      municípios
    </div>
  </div>
</header>

<!-- ── App layout ──────────────────────────────────────── -->
<div id="app">

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-inner">
      <div class="tabs">
        <button class="tab-btn active" data-tab="atuacao">✅ Atuação</button>
        <button class="tab-btn"        data-tab="limitrofe">📍 Limítrofes</button>
      </div>

      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="Buscar município..." autocomplete="off" autocorrect="off">
      </div>

      <div id="municipio-list" role="list"></div>

      <div class="sidebar-legend">
        <div class="legend-title">Legenda</div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:#7BFF6A;border:1.5px solid #0B3B26"></div>
          Municípios de atuação
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:rgba(0,229,255,.28);border:1px solid rgba(0,229,255,.72)"></div>
          Municípios limítrofes
        </div>
      </div>
    </div>
  </aside>

  <!-- Botão para recolher/expandir a sidebar esquerda (desktop) -->
  <button id="btn-collapse-sidebar" title="Recolher painel" aria-label="Recolher painel">‹</button>

  <!-- Main -->
  <main id="main">

    <!-- Toolbar -->
    <div id="toolbar">
      <button class="filter-btn active" data-region="todos">Todos</button>
      <button class="filter-btn" data-region="mg-oeste">MG Oeste</button>
      <button class="filter-btn" data-region="rs">RS</button>
      <button class="filter-btn" data-region="mg-leste">MG Leste</button>
      <div class="zoom-group">
        <button class="zoom-btn" id="btn-zoom-in"    title="Zoom +">+</button>
        <button class="zoom-btn" id="btn-zoom-out"   title="Zoom −">−</button>
        <button class="zoom-btn" id="btn-zoom-reset" title="Resetar" style="font-size:13px">⌂</button>
      </div>
    </div>

    <!-- Map -->
    <div id="map-container">
      <!-- Loading -->
      <div id="loading">
        <div class="spinner"></div>
        <p>Carregando mapa...</p>
        <small>Preparando dados geográficos</small>
      </div>

      <!-- Map -->
      <div id="map-wrapper">
        <div id="map" aria-label="Mapa de municípios"></div>
      </div>

      <!-- Tooltip -->
      <div id="tooltip" role="tooltip" aria-live="polite">
        <div id="tt-name"></div>
        <div id="tt-uf"></div>
        <div id="tt-tag"></div>
      </div>
    </div>

    <!-- Stats bar -->
    <div id="stats-bar">
      <div class="stat-cell"><strong id="s-atu">—</strong>Atuação</div>
      <div class="stat-cell"><strong id="s-lim">—</strong>Limítrofes</div>
      <div class="stat-cell"><strong id="s-mg">—</strong>em MG</div>
      <div class="stat-cell"><strong id="s-rs">—</strong>em RS</div>
    </div>

  </main>

  <!-- Info panel overlay (mobile) -->
  <div id="info-panel-overlay"></div>

  <!-- Info panel (sidebar direita) -->
  <aside id="info-panel" role="complementary">
    <div class="info-panel-inner">
      <button id="btn-close-info" aria-label="Fechar">✕</button>
      <h3 id="ip-nome"></h3>
      <div class="info-row"><span>Estado</span><strong id="ip-estado"></strong></div>
      <div class="info-row"><span>Região</span><strong id="ip-regiao"></strong></div>
      <div class="info-row"><span>Tipo</span><strong id="ip-tipo"></strong></div>
      <div id="ip-indicadores"></div>
    </div>
  </aside>
</div>

<!-- Toast -->
<div id="toast" role="status"></div>

<!-- PWA Install Banner -->
<div id="install-banner">
  <span>📱 Instalar como app</span>
  <button id="btn-install">Instalar</button>
  <button id="btn-dismiss-install">✕</button>
</div>

<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
